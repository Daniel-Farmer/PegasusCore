<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bg)" rx="12"/>
  <ellipse cx="450" cy="0" rx="450" ry="200" fill="url(#glow)"/>

  <!-- ===== HEADER ===== -->
  <text x="450" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">PEGASUS CORE</text>
  <rect x="330" y="84" width="240" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>
  <text x="450" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#a1a1aa">Ship production-ready AI apps fast</text>
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#71717a">A pre-wired Next.js 15 starter kit with Supabase auth, Postgres + pgvector,</text>
  <text x="450" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#71717a">AI chat via Bifrost, and visual agent pipelines via Flowise.</text>
  <text x="450" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52525b" font-style="italic">Ships with CLAUDE.md so AI tools understand your stack — vibe code from day one.</text>

  <!-- Tech pills -->
  <g transform="translate(450, 215)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="11">
    <g transform="translate(-300, 0)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/>
      <text y="4" fill="#e4e4e7">Next.js 15</text>
    </g>
    <g transform="translate(-195, 0)">
      <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#3ecf8e" fill-opacity="0.08" stroke="#3ecf8e" stroke-opacity="0.2"/>
      <text y="4" fill="#3ecf8e">Supabase</text>
    </g>
    <g transform="translate(-95, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.2"/>
      <text y="4" fill="#a78bfa">pgvector</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text y="4" fill="#60a5fa">Bifrost</text>
    </g>
    <g transform="translate(92, 0)">
      <rect x="-36" y="-12" width="72" height="24" rx="12" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text y="4" fill="#fbbf24">Flowise</text>
    </g>
    <g transform="translate(190, 0)">
      <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.2"/>
      <text y="4" fill="#22d3ee">Tailwind</text>
    </g>
    <g transform="translate(290, 0)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/>
      <text y="4" fill="#e4e4e7">Vercel</text>
    </g>
  </g>

  <line x1="60" y1="250" x2="840" y2="250" stroke="#27272a" stroke-width="1"/>

  <!-- ===== WHAT'S INCLUDED ===== -->
  <text x="60" y="285" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">What's Included</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa">
    <text x="75" y="312"><tspan fill="#3b82f6">&#x25CF;</tspan>  Auth flow — sign up, sign in, sign out, email confirmation, protected routes</text>
    <text x="75" y="334"><tspan fill="#3ecf8e">&#x25CF;</tspan>  Database CRUD — notes demo with Row Level Security (RLS)</text>
    <text x="75" y="356"><tspan fill="#8b5cf6">&#x25CF;</tspan>  File storage — upload, download, list, delete via Supabase Storage</text>
    <text x="75" y="378"><tspan fill="#06b6d4">&#x25CF;</tspan>  Vector search — embeddings and semantic similarity via pgvector</text>
    <text x="75" y="400"><tspan fill="#60a5fa">&#x25CF;</tspan>  AI chat — streaming chat via Bifrost gateway (OpenAI-compatible)</text>
    <text x="75" y="422"><tspan fill="#fbbf24">&#x25CF;</tspan>  AI agents — interact with Flowise chatflows from the app</text>
  </g>

  <line x1="60" y1="450" x2="840" y2="450" stroke="#27272a" stroke-width="1"/>

  <!-- ===== QUICK START ===== -->
  <text x="60" y="485" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">Quick Start</text>

  <text x="60" y="515" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">1. Clone and install</text>
  <g transform="translate(60, 525)">
    <rect width="500" height="52" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="12" y="22" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> git clone https://github.com/Daniel-Farmer/PegasusCore.git</text>
    <text x="12" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> cd PegasusCore &amp;&amp; npm install</text>
  </g>

  <text x="60" y="602" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">2. Configure environment</text>
  <g transform="translate(60, 612)">
    <rect width="500" height="32" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="12" y="21" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> cp .env.local.example .env.local</text>
  </g>
  <text x="60" y="666" font-family="system-ui, sans-serif" font-size="11.5" fill="#71717a">Fill in your Supabase URL and publishable key from your Supabase dashboard.</text>

  <text x="60" y="695" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">3. Run migrations + create storage bucket</text>
  <text x="60" y="715" font-family="system-ui, sans-serif" font-size="11.5" fill="#71717a">Run SQL files in supabase/migrations/ via Supabase SQL editor. Create a "files" bucket in Storage.</text>

  <text x="60" y="748" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">4. Start everything</text>
  <g transform="translate(60, 758)">
    <rect width="500" height="32" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="12" y="21" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> npm run dev</text>
  </g>

  <!-- Services table -->
  <g transform="translate(60, 810)">
    <rect width="500" height="28" rx="4" fill="#18181b"/>
    <text x="15" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#52525b">SERVICE</text>
    <text x="150" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#52525b">URL</text>
    <text x="340" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#52525b">PURPOSE</text>
    <text x="15" y="50" font-family="ui-monospace, monospace" font-size="12" fill="#e4e4e7">Next.js</text>
    <text x="150" y="50" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa">localhost:3000</text>
    <text x="340" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">App + API</text>
    <text x="15" y="72" font-family="ui-monospace, monospace" font-size="12" fill="#60a5fa">Bifrost</text>
    <text x="150" y="72" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa">localhost:8080</text>
    <text x="340" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">AI gateway</text>
    <text x="15" y="94" font-family="ui-monospace, monospace" font-size="12" fill="#fbbf24">Flowise</text>
    <text x="150" y="94" font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa">localhost:3001</text>
    <text x="340" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">Agent builder</text>
  </g>

  <line x1="60" y1="930" x2="840" y2="930" stroke="#27272a" stroke-width="1"/>

  <!-- ===== PROJECT STRUCTURE ===== -->
  <text x="60" y="965" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">Project Structure</text>
  <g transform="translate(60, 978)">
    <rect width="600" height="170" rx="6" fill="#18181b" stroke="#27272a"/>
    <g font-family="ui-monospace, monospace" font-size="12" fill="#a1a1aa">
      <text x="12" y="22" fill="#71717a">app/</text>
      <text x="12" y="40">  (auth)/           <tspan fill="#52525b"># login, signup, email confirm</tspan></text>
      <text x="12" y="58">  (protected)/      <tspan fill="#52525b"># dashboard, notes, files, search, chat, agents</tspan></text>
      <text x="12" y="76">  api/              <tspan fill="#52525b"># chat, embeddings, agents, setup</tspan></text>
      <text x="12" y="98" fill="#71717a">lib/</text>
      <text x="12" y="116">  supabase/         <tspan fill="#52525b"># browser + server clients, middleware</tspan></text>
      <text x="12" y="134">  bifrost.ts        <tspan fill="#52525b"># OpenAI SDK with baseURL override</tspan></text>
      <text x="12" y="152">  flowise.ts        <tspan fill="#52525b"># FlowiseClient SDK</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <text x="450" y="1175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f46">MIT License  &#x2022;  Deploy on Vercel  &#x2022;  Bifrost + Flowise need separate hosting for production</text>
</svg>
