<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bg)" rx="12"/>
  <ellipse cx="400" cy="0" rx="500" ry="200" fill="url(#glow)"/>

  <!-- ===== HEADER ===== -->
  <text x="400" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">PEGASUS CORE</text>
  <rect x="270" y="96" width="260" height="3" rx="1.5" fill="url(#accent)" opacity="0.4"/>
  <text x="400" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#a1a1aa">Ship production-ready AI apps fast</text>
  <text x="400" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#71717a">Pre-wired Next.js 15 + Supabase auth + Postgres/pgvector</text>
  <text x="400" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#71717a">+ AI chat via Bifrost + agent pipelines via Flowise</text>
  <text x="400" y="216" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52525b" font-style="italic">Ships with CLAUDE.md — vibe code your whole app from day one</text>

  <!-- Tech pills -->
  <g transform="translate(400, 258)" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="13">
    <g transform="translate(-270, 0)">
      <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/>
      <text y="5" fill="#e4e4e7">Next.js 15</text>
    </g>
    <g transform="translate(-160, 0)">
      <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#3ecf8e" fill-opacity="0.08" stroke="#3ecf8e" stroke-opacity="0.2"/>
      <text y="5" fill="#3ecf8e">Supabase</text>
    </g>
    <g transform="translate(-55, 0)">
      <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.2"/>
      <text y="5" fill="#a78bfa">pgvector</text>
    </g>
    <g transform="translate(48, 0)">
      <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text y="5" fill="#60a5fa">Bifrost</text>
    </g>
    <g transform="translate(145, 0)">
      <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text y="5" fill="#fbbf24">Flowise</text>
    </g>
    <g transform="translate(248, 0)">
      <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.2"/>
      <text y="5" fill="#22d3ee">Tailwind</text>
    </g>
  </g>

  <line x1="50" y1="300" x2="750" y2="300" stroke="#27272a" stroke-width="1"/>

  <!-- ===== WHAT'S INCLUDED ===== -->
  <text x="50" y="340" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">What's Included</text>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#a1a1aa">
    <text x="65" y="374"><tspan fill="#3b82f6" font-size="18">&#x25CF;</tspan>  Auth — signup, login, email confirm, protected routes</text>
    <text x="65" y="402"><tspan fill="#3ecf8e" font-size="18">&#x25CF;</tspan>  Database — CRUD with Row Level Security</text>
    <text x="65" y="430"><tspan fill="#8b5cf6" font-size="18">&#x25CF;</tspan>  Storage — upload, download, list, delete files</text>
    <text x="65" y="458"><tspan fill="#06b6d4" font-size="18">&#x25CF;</tspan>  Vector search — embeddings + semantic similarity</text>
    <text x="65" y="486"><tspan fill="#60a5fa" font-size="18">&#x25CF;</tspan>  AI chat — streaming via Bifrost (OpenAI-compatible)</text>
    <text x="65" y="514"><tspan fill="#fbbf24" font-size="18">&#x25CF;</tspan>  AI agents — Flowise chatflow integration</text>
  </g>

  <line x1="50" y1="545" x2="750" y2="545" stroke="#27272a" stroke-width="1"/>

  <!-- ===== QUICK START ===== -->
  <text x="50" y="585" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">Quick Start</text>

  <text x="50" y="618" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">1. Clone and install</text>
  <g transform="translate(50, 630)">
    <rect width="700" height="58" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="14" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> git clone https://github.com/Daniel-Farmer/PegasusCore.git</text>
    <text x="16" y="46" font-family="ui-monospace, monospace" font-size="14" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> cd PegasusCore &amp;&amp; npm install</text>
  </g>

  <text x="50" y="716" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">2. Configure environment</text>
  <g transform="translate(50, 728)">
    <rect width="700" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="25" font-family="ui-monospace, monospace" font-size="14" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> cp .env.local.example .env.local</text>
  </g>
  <text x="50" y="790" font-family="system-ui, sans-serif" font-size="14" fill="#71717a">Add your Supabase URL + publishable key. Run migrations in SQL editor. Create a "files" bucket.</text>

  <text x="50" y="825" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">3. Start everything</text>
  <g transform="translate(50, 837)">
    <rect width="700" height="38" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="25" font-family="ui-monospace, monospace" font-size="14" fill="#a1a1aa"><tspan fill="#52525b">$</tspan> npm run dev</text>
  </g>

  <!-- Services -->
  <g transform="translate(50, 895)" font-family="ui-monospace, monospace" font-size="14">
    <text x="0" y="0" fill="#e4e4e7" font-weight="600">Next.js</text>
    <text x="130" y="0" fill="#a1a1aa">:3000</text>
    <text x="260" y="0" font-family="system-ui, sans-serif" fill="#71717a">App + API</text>

    <text x="0" y="26" fill="#60a5fa" font-weight="600">Bifrost</text>
    <text x="130" y="26" fill="#a1a1aa">:8080</text>
    <text x="260" y="26" font-family="system-ui, sans-serif" fill="#71717a">AI gateway</text>

    <text x="0" y="52" fill="#fbbf24" font-weight="600">Flowise</text>
    <text x="130" y="52" fill="#a1a1aa">:3001</text>
    <text x="260" y="52" font-family="system-ui, sans-serif" fill="#71717a">Agent builder</text>
  </g>

  <line x1="50" y1="970" x2="750" y2="970" stroke="#27272a" stroke-width="1"/>

  <!-- ===== STRUCTURE ===== -->
  <text x="50" y="1005" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">Project Structure</text>
  <g transform="translate(50, 1018)" font-family="ui-monospace, monospace" font-size="14" fill="#a1a1aa">
    <text x="0" y="20" fill="#71717a">app/</text>
    <text x="0" y="42">  (auth)/        <tspan fill="#52525b">login, signup, confirm</tspan></text>
    <text x="0" y="64">  (protected)/   <tspan fill="#52525b">dashboard, notes, files, search, chat, agents</tspan></text>
    <text x="0" y="86">  api/           <tspan fill="#52525b">chat, embeddings, agents, setup</tspan></text>
  </g>

  <!-- Footer -->
  <text x="400" y="1080" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#3f3f46">MIT License</text>
</svg>
