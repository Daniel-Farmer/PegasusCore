services:
  traefik:
    image: traefik:v3.0
    container_name: pegasus-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./acme:/etc/traefik/acme
    networks:
      - web

networks:
  web:
    external: true
