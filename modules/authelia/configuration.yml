server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

authentication_backend:
  file:
    path: /data/users.yml

session:
  cookies:
    - domain: localhost
      authelia_url: http://localhost:9091

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notifications.txt

access_control:
  default_policy: deny
  rules:
    - domain: "*.localhost"
      policy: one_factor
